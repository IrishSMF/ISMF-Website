name: Auto Upload Content
on:
  issues:
    types: [opened, labeled]

jobs:
  process-macro-report:
    if: contains(github.event.issue.labels.*.name, 'macro-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
      
      - name: Update latest.json and push
        run: |
          git config user.name "ISMF Bot"
          git config user.email "irishstudentfund@gmail.com"
          
          # Ensure we're on the latest main
          git fetch origin main
          git reset --hard origin/main
          
          # Create/update the file
          mkdir -p public/reports
          echo '{
            "title": "${{ github.event.issue.title }}",
            "date": "$(date +%Y-%m)",
            "file": "$(date +%Y-%m).pdf"
          }' > public/reports/latest.json
          
          # Commit and push
          git add public/reports/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📄 Update macro report: ${{ github.event.issue.title }}"
            git push origin main
          fi
          
      - name: Close issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  process-event:
    if: contains(github.event.issue.labels.*.name, 'event')
