name: Auto Upload Content
on:
  issues:
    types: [opened, labeled]

jobs:
  process-macro-report:
    if: contains(github.event.issue.labels.*.name, 'macro-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history for rebase
      
      - name: Extract PDF from issue
        run: |
          # GitHub Action downloads attachment from issue
          # Saves to public/reports/YYYY-MM.pdf
          
      - name: Update latest.json
        run: |
          echo '{
            "title": "${{ github.event.issue.title }}",
            "date": "$(date +%Y-%m)",
            "file": "$(date +%Y-%m).pdf"
          }' > public/reports/latest.json
          
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📄 Update macro report: ${{ github.event.issue.title }}"
          file_pattern: "public/reports/latest.json"
          commit_user_name: "ISMF Bot"
          commit_user_email: "irishstudentfund@gmail.com"
          pull: --rebase --autostash
          
      - name: Close issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  process-event:
    if: contains(github.event.issue.labels.*.name, 'event')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
